<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
  :root { --bg:#f3f3f3; --text:#222; --panel:#fff; --border:#cfcfcf; --muted:#666; --in-bg:#fff; --in-bd:#b9b9b9; --sel:#2b6cb0; --sel-bg:#e8f0fa; --err:#b00020; --ok:#2e7d32; --warn:#9a6700; --btn-bg:#fdfdfd; --btn-h:#e9f1fb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1e2228; --text:#dde3ea; --panel:#262b33; --border:#3b434f; --muted:#9aa5b1; --in-bg:#1b1f25; --in-bd:#4a5462; --sel:#5b8fd0; --sel-bg:#27384d; --err:#ff8a80; --ok:#6fcf73; --warn:#e0b04a; --btn-bg:#2d333c; --btn-h:#34506f; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { font-family: "Segoe UI", Tahoma, sans-serif; font-size: 13px; margin: 0; padding: 12px 14px; background: var(--bg); color: var(--text); }
  h3 { margin: 14px 0 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; margin-bottom: 10px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .grow { flex: 1; min-width: 0; }
  input[type=text], select { width: 100%; padding: 5px 7px; border: 1px solid var(--in-bd); border-radius: 4px; font: inherit; background: var(--in-bg); color: var(--text); }
  input[type=color] { width: 44px; height: 28px; padding: 0; border: 1px solid var(--in-bd); border-radius: 4px; background: var(--in-bg); }
  button { font: inherit; color: var(--text); padding: 5px 12px; border: 1px solid var(--in-bd); border-radius: 4px; background: var(--btn-bg); cursor: pointer; }
  button:hover { background: var(--btn-h); }
  button.primary { background: var(--sel); color: #fff; border-color: var(--sel); font-weight: 600; }
  button.small { padding: 2px 8px; }
  #cols { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; }
  .col { border: 1px solid var(--border); border-radius: 6px; padding: 6px; cursor: pointer; text-align: center; background: var(--panel); position: relative; }
  .col.on { border: 2px solid var(--sel); padding: 5px; background: var(--sel-bg); }
  .col .sw { height: 22px; border-radius: 4px; border: 1px solid var(--border); }
  .col .nm { font-size: 11px; margin-top: 3px; line-height: 1.2; }
  .col .ar { font-size: 11px; color: var(--muted); }
  .col .x { position: absolute; top: 1px; right: 3px; font-size: 12px; color: var(--err); }
  #types, #profs { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
  #profs { margin-top: 0; }
  #types button.on, #profs button.on { border-color: var(--sel); color: var(--sel); background: var(--sel-bg); }
  #fills { border: 1px solid var(--border); border-radius: 6px; max-height: 210px; overflow-y: auto; background: var(--panel); }
  .fl { display: flex; gap: 8px; align-items: center; padding: 6px 9px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .fl:last-child { border-bottom: none; }
  .fl.on { background: var(--sel-bg); }
  .fl .sw { width: 16px; height: 16px; border-radius: 3px; border: 1px solid var(--border); flex: none; }
  .fl .nm { flex: 1; min-width: 0; }
  .fl .ar { color: var(--muted); white-space: nowrap; }
  .fl .sup { font-size: 11px; color: var(--warn); white-space: nowrap; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .sum { font-weight: 600; word-break: break-word; }
  .msg { white-space: pre-wrap; margin-top: 6px; }
  .msg.err { color: var(--err); } .msg.ok { color: var(--ok); } .msg.warn { color: var(--warn); }
  label { display: block; margin: 6px 0 2px; color: var(--muted); font-size: 12px; }
  #custom { display: none; margin-top: 8px; }
</style></head><body>

<div class="panel">
  <div class="row"><b class="grow" id="selInfo">Виділіть рамковий фасад у моделі</b><button class="small" onclick="sketchup.refresh_sel()" title="Оновити стан виділення">↻ Оновити</button></div>
  <div class="hint" id="curVar"></div>
  <div class="msg warn" id="selWarn"></div>
</div>

<h3>Профіль</h3>
<div class="panel">
  <div id="profs"></div>
  <div class="hint" id="profHint"></div>
</div>

<h3>Колір профілю</h3>
<div class="panel">
  <div id="cols"></div>
  <div class="row" style="margin-top:8px"><button class="small" onclick="toggleCustom('color')">+ Свій колір профілю…</button></div>
</div>

<h3>Наповнення</h3>
<div class="panel">
  <input type="text" id="q" placeholder="Пошук за назвою або кодом (по всіх типах)" oninput="drawFills()">
  <div id="types"></div>
  <div id="fills"></div>
  <div class="row" style="margin-top:8px"><button class="small" onclick="toggleCustom('fill')">+ Своє наповнення (інший постачальник)…</button></div>
  <div id="custom">
    <div class="hint" id="customTitle"></div>
    <label>Повна назва (як у постачальника)</label><input type="text" id="cName">
    <div class="row">
      <div class="grow"><label>Код / артикул</label><input type="text" id="cArt"></div>
      <div class="grow" id="cSupBox"><label>Постачальник</label><input type="text" id="cSup" placeholder="Назва компанії"></div>
    </div>
    <div class="row">
      <div><label>Колір у моделі</label><input type="color" id="cHex" value="#cde1e6"></div>
      <div class="grow" id="cKindBox"><label>Вигляд</label>
        <select id="cKind"><option value="0.28">Скло прозоре</option><option value="0.92">Дзеркало</option><option value="1">Непрозоре (фарбоване)</option></select></div>
    </div>
    <div class="row" style="margin-top:8px"><button onclick="saveCustom()">Зберегти й вибрати</button><button onclick="toggleCustom(null)">Скасувати</button></div>
    <div class="msg err" id="cErr"></div>
  </div>
</div>

<div class="panel">
  <div class="hint">Обрано (так названо матеріали, у А4 й у файлі експорту):</div>
  <div class="sum" id="sum">—</div>
</div>

<div class="row" style="justify-content:flex-end; gap:8px">
  <button class="primary" onclick="applyV()">Застосувати до виділених</button>
  <button onclick="sketchup.close()">Закрити</button>
</div>
<div class="msg" id="res"></div>
