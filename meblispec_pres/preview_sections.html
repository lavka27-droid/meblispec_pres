    body {

      padding: 20px;
      background: #0f172a;
      font-family: 'Inter', sans-serif;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;

      min-height: 100vh;

    header {
      text-align: center;
      margin-bottom: 16px;

    h1 {
      margin: 0 0 6px 0;
      font-size: 22px;
      font-weight: 700;
      color: #38bdf8;
    }
    p.desc {
      margin: 0;
      font-size: 13px;
      color: #94a3b8;
    }
    
    .toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      background: #1e293b;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .btn {
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid transparent;
      background: #334155;
      color: #f1f5f9;
      cursor: pointer;
      transition: 0.15s ease;
    }
    .btn:hover {
      background: #475569;
    }
    .btn.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #fff;
    }
    
    .sheet-wrapper {
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border-radius: 4px;
      background: #fff;
      position: relative;
      width: 1122px;
      height: 794px;
      overflow: hidden;
    }
    
    #svg-container {
      width: 1122px;
      height: 794px;
      position: absolute;
      top: 0;
      left: 0;
    }
    
    #header {
      position: absolute;
      top: 35px;
      left: 45px;
      border-left: 6px solid #0f172a;
      padding-left: 16px;
      color: #0f172a;
      font-family: 'Inter', sans-serif;
    }
    #header .title {
      font-size: 18px;
      font-weight: 700;
    }
    #header .dims {
      font-size: 13px;
      color: #475569;
      margin-top: 2px;
    }
    
    .tables-container {
      position: absolute;
      top: 35px;
      right: 35px;
      max-height: 680px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    table {
      border-collapse: collapse;
      font-size: 8pt;
      background: #fff;
      border: 1px solid #cbd5e1;
      font-family: 'JetBrains Mono', monospace;
    }
    th, td {
      border: 1px solid #e2e8f0;
      padding: 3px 6px;
      text-align: left;
      color: #1e293b;
    }
    th {
      background: #f8fafc;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      text-align: center;
    }
    .section-th {
      background: #e2e8f0 !important;
      font-weight: 700;
      text-align: left !important;
    }
